# Push to main → type-check + all tests → database migrations → deploy to production.
# If anything fails, nothing deploys.
name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: production, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix web ci && npm run build:web
      - run: npm run typecheck
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix web ci && npm run build:web
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply klausum-otp --remote
      - name: Deploy
        env:
          MSG: ${{ github.sha }}
        run: npx wrangler deploy --message "$MSG"
      - name: Smoke test
        run: |
          sleep 10
          curl -fsS https://otp.klausum.study/health | grep -q '"ok":true'
