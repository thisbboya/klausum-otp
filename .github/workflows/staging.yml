# Pull request → tests → deploy to staging (otp-staging.klausum.study) so you can try it first.
# Pull requests from forks don't get secrets, so they only run the tests.
name: Staging
on:
  pull_request:
  workflow_dispatch:
concurrency: { group: staging, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  deploy-staging:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx wrangler d1 migrations apply klausum-otp-staging --remote --env staging
      - env:
          MSG: staging ${{ github.sha }}
        run: npx wrangler deploy --env staging --message "$MSG"
      - run: sleep 10 && curl -fsS https://otp-staging.klausum.study/health | grep -q '"ok":true'
